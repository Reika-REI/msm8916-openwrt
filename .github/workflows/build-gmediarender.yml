
name: Build GMediaRender APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache OpenWrt Downloads and Toolchain
        uses: actions/cache@v5
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
            openwrt/staging_dir/host
          key: gmediarender-openwrt-${{ hashFiles('version', 'openwrt/feeds.conf.default', 'diffconfigs/uz801') }}
          restore-keys: |
            openwrt-cache-
            gmediarender-openwrt-

      - name: Prepare OpenWrt
        run: ./build.sh prepare

      - name: Prepare OpenWrt Configuration
        run: |
          docker compose -f devenv/docker-compose.yml exec -T builder bash -lc '
            cd /repo/openwrt

            cp /repo/diffconfigs/uz801 .config
            make defconfig V=sc

            sed -i \
              -e "s/^CONFIG_DEFAULT_kmod-gpio-button-hotplug=y/# CONFIG_DEFAULT_kmod-gpio-button-hotplug is not set/" \
              -e "s/^CONFIG_PACKAGE_kmod-gpio-button-hotplug=y/# CONFIG_PACKAGE_kmod-gpio-button-hotplug is not set/" \
              .config

            echo "=== VERIFY CONFIGURATION ==="
            grep -n "gpio-button-hotplug" .config || true

            if grep -q "^CONFIG_PACKAGE_kmod-gpio-button-hotplug=y" .config; then
              echo "ERROR: gpio-button-hotplug masih aktif!"
              exit 1
            fi
          '

      - name: Build Host Tools and Target Toolchain
        run: |
          docker compose -f devenv/docker-compose.yml exec -T builder bash -lc '
            cd /repo/openwrt
            make tools/install toolchain/install V=s
          '

      - name: Verify Configuration Before Build
        run: |
          docker compose -f devenv/docker-compose.yml exec -T builder bash -lc '
            cd /repo/openwrt
            echo "=== FINAL CONFIGURATION ==="
            grep -n "gpio-button-hotplug" .config || true
          '
          
      - name: Build Linux Kernel
        run: |
          docker compose -f devenv/docker-compose.yml exec -T builder bash -lc '
            cd /repo/openwrt
            make target/linux/compile V=s
          '
          
      - name: Build GMediaRender
        run: ./build.sh package gmediarender

      
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts

          echo "=== Searching GMediaRender APK ==="

          find openwrt/bin/packages \
            -type f \
            -iname '*gmediarender*.apk' \
            -print \
            -exec cp -v {} artifacts/ \;

          echo "=== Collected APK ==="

          if ! compgen -G "artifacts/*.apk" > /dev/null; then
            echo "GMediaRender APK not found!"
            echo "=== Available APK files ==="
            find openwrt/bin/packages -type f -name '*.apk'
            exit 1
          fi

          ls -lh artifacts/


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gmediarender-apk
          path: artifacts/*.apk
          if-no-files-found: error
          
